services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: charming-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # 只绑定服务器本机，配合 SSH 隧道供 Navicat 使用，不暴露到公网。
    ports:
      - "127.0.0.1:15432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: charming-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis_data:/data

    ports: []

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    networks:
      - default
      - nginx_net
    build: .
    container_name: charming-backend
    restart: unless-stopped

    env_file:
      - .env

    # 容器内部不能使用 127.0.0.1 连接其他容器。
    # postgres 和 redis 是上面的服务名称。
    environment:
      DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      UPLOAD_DIR: /app/uploads

      # 替换成你的真实 HTTPS 域名。
      PUBLIC_BASE_URL: https://api.szcharmrobo.com

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - "8000"

    # 每次容器启动，先执行未执行的数据库迁移，再启动 FastAPI。
    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        exec uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --proxy-headers
        --forwarded-allow-ips "*"
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: charmrobo_default

  nginx_net:
    external: true
    name: charming_charming-net
